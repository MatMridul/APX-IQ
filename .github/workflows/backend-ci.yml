name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "**.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      - "ruff.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      - "ruff.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    name: Lint & Test (Python 3.13)
    runs-on: ubuntu-latest
    env:
      # CI runs storage in in-memory mode; no PostgreSQL service needed.
      DATABASE_URL: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff — blocking)
        run: ruff check .

      - name: Tests (pytest — blocking)
        run: pytest -v --tb=short
