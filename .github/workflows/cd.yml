name: Continuous Deployment (CD)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ─── 1. Quality & Verification Gates ──────────────────────────────────────────
  verify:
    name: 1. Verify Tests & Linters
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apxiq_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint Python (Ruff)
        run: ruff check .

      - name: Run Backend Unit Tests (In-Memory Path)
        run: pytest -m "not integration" -v --tb=short

      - name: Run PostgreSQL Integration Tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/apxiq_test
        run: |
          alembic upgrade head
          pytest -m integration -v --tb=short

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck TypeScript (UI)
        working-directory: ui
        run: npx tsc --noEmit

      - name: Lint UI (ESLint)
        working-directory: ui
        run: npm run lint

      - name: Compile Next.js Build
        working-directory: ui
        run: npm run build

  # ─── 2. Backend Deployment (AWS Lambda Serverless Zero-Burn) ──────────────────
  deploy-backend:
    name: 2. Deploy Backend to AWS Lambda (Zero-Burn)
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: env.HAS_AWS_SECRET == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        env:
          HAS_AWS_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

      - name: Configure AWS Credentials
        if: env.HAS_AWS_SECRET == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        env:
          HAS_AWS_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

      - name: Deploy to AWS Lambda
        id: deploy
        if: env.HAS_AWS_SECRET == 'true'
        run: |
          python scripts/deploy_aws_lambda.py --region ${{ secrets.AWS_REGION || 'ap-south-1' }}
        env:
          HAS_AWS_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ─── 3. Frontend Deployment (Cloudflare Pages) ─────────────────────────────────
  deploy-frontend:
    name: 3. Deploy Frontend to Cloudflare Pages
    needs: [verify, deploy-backend]
    runs-on: ubuntu-latest
    if: always() && needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        working-directory: ui
        run: npm ci

      - name: Build Next.js for Production
        working-directory: ui
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-backend.outputs.backend_url || 'https://jidu3ftfeggs2x7bh7zatpcauu0cukuy.lambda-url.ap-south-1.on.aws' }}
          NEXT_PUBLIC_WS_URL: http://localhost:3001
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_SECRET == 'true'
        working-directory: ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_CF_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler pages project create apx-iq --production-branch main || true
          npx wrangler pages deploy out --project-name apx-iq --commit-dirty=true
