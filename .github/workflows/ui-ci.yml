name: UI CI

on:
  push:
    branches: ["main"]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"

jobs:
  ui:
    name: Typecheck, Lint & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc — blocking)
        run: npx tsc --noEmit

      - name: Lint (eslint — blocking; errors fail the build)
        run: npm run lint

      - name: Dependency audit (report only)
        continue-on-error: true
        run: npm audit --omit=dev || true

      - name: Build (next build)
        run: npm run build
