version: 1.0
runtime: python312

build:
  commands:
    pre-build:
      - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
    build:
      - pip install --no-cache-dir -r requirements.txt

run:
  command: uvicorn api.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: LOG_FORMAT
      value: json
    - name: CORS_ORIGINS
      value: "*"
