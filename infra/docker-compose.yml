version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: apx_iq_db
    environment:
      - POSTGRES_PASSWORD=apxiq_dev_secret
      - POSTGRES_USER=apxiq_user
      - POSTGRES_DB=apxiq_core
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - apx_iq_net
    restart: always

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: apx_iq_api
    ports:
      - "8000:8000"
    env_file: ../.env
    depends_on:
      - db
    networks:
      - apx_iq_net
    restart: always

  ingestion:
    build:
      context: ..
      dockerfile: Dockerfile.ingestion
    container_name: apx_iq_ingestion
    network_mode: host  # Required for UDP broadcast (will not use apx_iq_net on Windows/Mac smoothly but will listen to host port 20777 directly)
    env_file: ../.env
    restart: always

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
    container_name: apx_iq_ui
    ports:
      - "3000:3000"
    env_file: ../ui/.env.local
    networks:
      - apx_iq_net
    restart: always

networks:
  apx_iq_net:
    driver: bridge

volumes:
  pg_data:
