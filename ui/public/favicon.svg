<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#06080d"/>
  <rect width="32" height="32" rx="7" fill="url(#borderGrad)" fill-opacity="0.15"/>
  <!-- Checkered accent top-right -->
  <rect x="22" y="3" width="4" height="4" fill="#f59e0b" opacity="0.9"/>
  <rect x="26" y="3" width="3" height="4" fill="#06080d"/>
  <rect x="22" y="7" width="4" height="4" fill="#06080d"/>
  <rect x="26" y="7" width="3" height="4" fill="#f59e0b" opacity="0.9"/>
  <!-- Stylized A letterform -->
  <path d="M8 25L16 7L24 25" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M11 19H21" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom accent bar -->
  <rect x="6" y="28" width="20" height="1.5" rx="0.75" fill="#f59e0b" opacity="0.5"/>
  <defs>
    <linearGradient id="goldGrad" x1="8" y1="7" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcf6ba"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#bf953f"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#bf953f"/>
    </linearGradient>
  </defs>
</svg>
